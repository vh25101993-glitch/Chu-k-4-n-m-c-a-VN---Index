name: Build Ga F0 v2 APK

on:
  push:
    branches: [build-ga-f0-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Gà F0 v2 Android source
        shell: bash
        run: |
          cat > ga-f0-source.b64 <<'EOF'

EOF
          base64 -d ga-f0-source.b64 > ga-f0-source.zip
          unzip -q ga-f0-source.zip
          test -f android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gà F0 v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ga-f0-vnindex-v2-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
